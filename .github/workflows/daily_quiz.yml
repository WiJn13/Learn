name: Daily Python Quiz

on:
  schedule:
    # 北京时间每天晚上10:00 = UTC 14:00
    - cron: "0 14 * * *"

  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  generate-daily-quiz:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate daily quiz with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_daily_quiz.py

      - name: Create GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
          gh issue create \
            --title "Python每日小测 - $DATE" \
            --body-file today_quiz.md