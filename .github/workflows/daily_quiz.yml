name: Daily Python Quiz

on:
  schedule:
    # 北京时间每天晚上10:00 = UTC 14:00
    - cron: "0 14 * * *"

  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-python-quiz
  cancel-in-progress: false

jobs:
  generate-daily-quiz:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check whether today's quiz issue already exists
        id: existing_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
          TITLE="Python每日小测 - $DATE"
          EXISTING_TITLE=$(gh issue list --state all --search "$TITLE in:title" --json title --jq '.[].title' | grep -Fx "$TITLE" || true)

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          if [ -n "$EXISTING_TITLE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Today's quiz issue already exists: $TITLE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.existing_issue.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate daily quiz with Gemini
        if: steps.existing_issue.outputs.exists != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python scripts/generate_daily_quiz.py

      - name: Create GitHub issue
        if: steps.existing_issue.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "${{ steps.existing_issue.outputs.title }}" \
            --body-file today_quiz.md
