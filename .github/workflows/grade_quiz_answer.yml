name: Grade Quiz Answer

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  grade-answer:
    if: >
      contains(github.event.issue.title, 'Python每日小测') &&
      github.event.comment.user.type != 'Bot'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Grade answer with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python scripts/grade_issue_answer.py

      - name: Reply with grading result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file grade_result.md