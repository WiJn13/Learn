name: Grade Quiz Answer

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: read

jobs:
  grade-answer:
    if: >
      startsWith(github.event.issue.title, 'Python每日小测 - ') &&
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Get issue comments
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              per_page: 100,
            });

            const text = comments.data.map((c, index) => {
              return `--- 评论 ${index + 1}，作者：${c.user.login} ---\n${c.body}`;
            }).join("\n\n");

            core.exportVariable("ISSUE_COMMENTS", text);

      - name: Grade answer with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python scripts/grade_issue_answer.py

      - name: Reply with grading result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body-file grade_result.md
