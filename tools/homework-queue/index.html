<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作业讲解排队</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div>
          <h1>作业讲解排队</h1>

        </div>
        <div class="top-actions">
          <button class="secondary" id="editChildrenButton">编辑名单</button>
          <button class="secondary" id="clearDoneButton">清空今日记录</button>
          <button class="danger" id="clearQueueButton">清空队列</button>
        </div>
      </section>

      <section class="dashboard">
        <section class="children-panel" aria-labelledby="childrenTitle">
          <div class="section-heading">
            <h2 id="childrenTitle">小朋友</h2>
            <span id="childrenCount"></span>
          </div>
          <div class="children-grid" id="childrenGrid"></div>
        </section>

        <section class="queue-panel" aria-labelledby="queueTitle">
          <div class="queue-controls">
            <div>
              <h2 id="queueTitle">当前队列</h2>
              <span id="queueCount"></span>
            </div>
            <div class="call-actions">
              <button class="primary" id="nextButton">下一个</button>
              <button class="secondary" id="replayButton">重新播报</button>
              <button class="secondary" id="undoButton">撤销</button>
            </div>
          </div>
          <div class="current-call" id="currentCall">还没有播报记录</div>
          <div class="queue-list" id="queueList"></div>
        </section>

        <section class="active-panel" aria-labelledby="activeTitle">
          <div class="section-heading">
            <h2 id="activeTitle">正在讲解</h2>
            <span id="activeCount"></span>
          </div>
          <div class="active-list" id="activeList"></div>
        </section>

        <section class="done-panel" aria-labelledby="doneTitle">
          <div class="section-heading">
            <h2 id="doneTitle">已讲完记录</h2>
            <span id="doneCount"></span>
          </div>
          <div class="done-list" id="doneList"></div>
        </section>
      </section>
    </main>

    <dialog class="editor-dialog" id="editorDialog">
      <form method="dialog" class="editor-card">
        <div class="editor-header">
          <div>
            <h2>编辑名单</h2>
            <p>名字、颜色、符号都会本地保存。</p>
          </div>
          <button class="icon-button" value="close" aria-label="关闭">×</button>
        </div>
        <div class="editor-list" id="editorList"></div>
        <div class="editor-actions">
          <button class="secondary" type="button" id="resetChildrenButton">恢复默认名单</button>
          <button class="primary" value="save">完成</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
